[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Playwright er devDependency for QA-skriptene. Uten denne laster npm ned
  # ~300 MB nettlesere ved hver deploy, for et verktøy byggingen aldri bruker.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Alt under /assets har innholdshash i navnet. Ny versjon = ny fil.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
